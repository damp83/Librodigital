# Publica el aula en GitHub Pages cada vez que cambia la rama main.
# Antes de publicar, actualiza el catálogo (scripts/actualizar_catalogo.py): recoge los PDF
# de subir/<curso>/, los comprime sin pérdida, genera portadas, recalcula páginas y comprueba catalogo.json.
# Después pasa las pruebas automáticas (pruebas/pruebas.mjs) sobre la web ya actualizada.
# Si el catálogo tiene un error o falla alguna prueba, no se publica nada y la web sigue como estaba.
name: Publicar el aula

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-aula
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Siempre la versión más reciente de main (no la del momento en que se subió el archivo): si se suben
      # varias tandas seguidas, cada publicación espera a la anterior y parte de lo que esta ya guardó.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar herramientas de PDF
        run: pip install "pypdfium2>=5,<6" "pillow>=10" "pikepdf>=9"

      - name: Actualizar el catálogo
        run: python scripts/actualizar_catalogo.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pruebas/package-lock.json

      - name: Preparar las pruebas
        run: |
          npm ci --prefix pruebas
          cd pruebas && npx playwright install --with-deps chromium

      - name: Probar la web
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1
          node pruebas/pruebas.mjs

      - name: Quitar las herramientas de prueba (no se publican)
        if: always()
        run: rm -rf pruebas/node_modules

      - name: Guardar el catálogo actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalogo.json materiales portadas subir ':(glob)*.pdf'   # *.pdf: los subidos por error a la carpeta principal
          if git diff --cached --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "Actualiza el catálogo automáticamente"
            # Si mientras tanto se ha subido algo más, se encadena encima. Si no encaja, no se fuerza: esa
            # subida lanza su propia publicación, que empezará desde lo último y lo procesará todo.
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Catálogo guardado."
            else
              git rebase --abort 2>/dev/null || true
              echo "::warning title=Publicación::Se ha subido algo mientras se publicaba. No pasa nada: la siguiente publicación, que ya está en cola, lo procesará todo."
            fi
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
