# Publica el aula en GitHub Pages cada vez que cambia la rama main.
# Antes de publicar, actualiza el catálogo (scripts/actualizar_catalogo.py): recoge los PDF
# de subir/<curso>/, genera portadas, recalcula páginas y comprueba catalogo.json.
# Si el catálogo tiene un error, no se publica nada y la web sigue como estaba.
name: Publicar el aula

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-aula
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de PDF
        run: pip install "pypdfium2>=5,<6" "pillow>=10"

      - name: Actualizar el catálogo
        run: python scripts/actualizar_catalogo.py

      - name: Guardar el catálogo actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalogo.json materiales portadas subir
          if git diff --cached --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "Actualiza el catálogo automáticamente"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
